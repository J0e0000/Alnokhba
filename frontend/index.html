    <script type="application/ld+json" id="nk-base-jsonld">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "النخبة | Alnokhba Edu",
      "url": "https://al-nokhbba.vercel.app",
      "logo": "https://al-nokhbba.vercel.app/logo-512.png",
      "description": "منصة عربية لإدارة مراكز وأنظمة التعليم: الطلاب، الحصص، الحضور والغياب، الواجبات، الامتحانات، تقارير أولياء الأمور، وتحليل الأداء.",
      "areaServed": ["EG", "SA", "MENA"],
      "knowsLanguage": ["ar", "en"]
    }
    </script>
    <!-- PERF (performance round): fonts used to load via TWO duplicated
         Google-Fonts @imports INSIDE the built CSS (a serial waterfall:
         built CSS → fonts CSS → woff2) and pulled the full Material Symbols
         variable font for exactly ONE icon. Now: preconnect + a single
         Cairo variable-font stylesheet (one file covers weights 400-900). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&display=swap" />
    <style>
      /* Boot splash (ES5-safe, no external font so it paints instantly) */
      #nokhba-boot {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0;
        background: #f4f7fb; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
        direction: rtl;
      }
      #nokhba-boot .nb-logo {
        width: 64px; height: 64px; border-radius: 18px; margin-bottom: 18px;
        background: #142d62; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
      }
      #nokhba-boot .nb-logo img { width: 100%; height: 100%; display: block; }
      #nokhba-boot .nb-ring {
        width: 34px; height: 34px; border-radius: 50%;
        border: 4px solid rgba(20, 45, 98, 0.15); border-top-color: #142d62;
        animation: nb-spin 0.8s linear infinite;
      }
      #nokhba-boot .nb-txt { margin-top: 14px; font-size: 14px; color: #64748b; }
      @keyframes nb-spin { to { transform: rotate(360deg); } }
      #nokhba-boot .nb-watchdog {
        background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;
        padding: 22px 20px; max-width: 320px; text-align: center;
        box-shadow: 0 10px 30px rgba(15,23,42,0.08);
      }
      #nokhba-boot .nb-watchdog h1 { font-size: 17px; font-weight: 900; color: #142d62; margin: 0 0 8px; }
      #nokhba-boot .nb-watchdog p { font-size: 13px; color: #64748b; line-height: 1.7; margin: 0 0 14px; }
      #nokhba-boot .nb-watchdog button {
        background: #142d62; color: #ffffff; border: 0; border-radius: 12px;
        padding: 10px 22px; font-size: 13px; font-weight: 800; cursor: pointer;
        font-family: inherit;
      }
    </style>
    <script src="/boot/storage-gen.js"></script>
    <script src="/boot/diag-engine.js"></script>
    <script src="/boot/ios-shims.js"></script>
  </head>
  <body>
    <div id="nokhba-boot">
      <div class="nb-logo"><img src="/nokhba-mark.svg" alt="النخبة" width="64" height="64" /></div>
      <div class="nb-ring"></div>
      <div class="nb-txt">جاري فتح النخبة…</div>
    </div>
    <div id="root"></div>
    <script src="/boot/prerender-fastpath.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
